name: K21 GPU reduction backward

on:
  push:
    branches:
      - codex/k21-gpu-reduction-backward-v01
    paths:
      - 'native/tensor-engine/src/**'
      - 'native/tensor-engine/amd_opencl_bf16_provider.py'
      - 'tests/k21-gpu-reduction-backward.test.mjs'
      - 'examples/native-ai/gpu-reduction-backward-*'
      - 'package.json'
      - '.github/workflows/k21-gpu-reduction-backward.yml'
  pull_request:
    paths:
      - 'native/tensor-engine/src/**'
      - 'native/tensor-engine/amd_opencl_bf16_provider.py'
      - 'tests/k21-gpu-reduction-backward.test.mjs'
      - 'examples/native-ai/gpu-reduction-backward-*'
      - 'package.json'
      - '.github/workflows/k21-gpu-reduction-backward.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  k21-gpu-reduction-backward:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run K21 GPU reduction backward candidate
        run: npm run test:k21-gpu-reduction-backward
