permissions:
  contents: read

jobs:
  focused-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build native compiler and VM
        run: npm run build:native
      - name: Universal stress unit tests
        run: node --test tests/universal*stress*.test.mjs
      - name: K08 Pure RCL XOR native learning campaign
        run: npm run evidence:k08-native-ai
      - name: K08 General MLP native learning campaign
        run: npm run evidence:k08-native-ai:general-mlp
      - name: K08 Tensor correctness and portable CPU engine tests
        run: npm run test:k08-tensor
      - name: K08 Native Autodiff portable verification
        run: npm run test:k08-autodiff
      - name: AI009 RCL self-hosted General MLP Tensor lowering admission
        run: npm run test:selfhost-general-mlp-tensor-lowering
      - name: K08 Native Autodiff portable evidence
        run: npm run evidence:k08-autodiff
      - name: K233 independent AI generation receipt replay
        run: npm run verify:k233-ai-generate
      - name: K02 independent AI generation receipt replay
        run: npm run verify:k02-ai-generate
      - name: K01 independent AI generation receipt replay
        run: npm run verify:k01-ai-generate
      - name: K03 independent AI generation receipt replay
        run: npm run verify:k03-ai-generate
      - name: K04 independent Server AI generation receipt replay
        run: node --test tests/k04-server*.test.mjs && npm run verify:k04-server-ai-generate
      - name: K327 independent Compiler AI generation receipt replay
        run: node --test tests/k327-compiler*.test.mjs && npm run verify:k327-compiler-ai-generate
      - name: K329/K332 independent Compiler Simulation Scientific AI receipt replay
        run: npm run test:k329-k332-compiler-simulation-scientific && npm run verify:k329-k332-compiler-simulation-scientific-receipt
      - name: K326 independent Compiler Database AI receipt replay
        run: npm run test:k326-compiler-database && npm run verify:k326-compiler-database-receipt
      - name: K336 independent Compiler Automation AI receipt replay
        run: npm run test:k336-compiler-automation && npm run verify:k336-compiler-automation-receipt
      - name: K334 independent Compiler Agent AI receipt replay
        run: npm run test:k334-compiler-agent && npm run verify:k334-compiler-agent-receipt
      - name: K331 independent Compiler Realtime AI receipt replay
        run: npm run test:k331-compiler-realtime && npm run verify:k331-compiler-realtime-receipt
      - name: K333 independent Compiler ML AI receipt replay
        run: npm run test:k333-compiler-machine-learning && npm run verify:k333-compiler-machine-learning-receipt
      - name: K340 independent Compiler Mixed AI receipt replay
        run: node --test tests/k340-compiler-mixed-paradigm.test.mjs tests/k340-compiler-mixed-paradigm-receipt.test.mjs && npm run verify:k340-compiler-mixed-paradigm-receipt
      - name: K337/K338 independent Compiler Governance AI receipt replay
        run: node --test tests/k337-k338-compiler-governance-reactive.test.mjs tests/k337-k338-compiler-governance-reactive-receipt.test.mjs && npm run verify:k337-k338-compiler-governance-reactive-receipt
      - name: K321/K322 independent Algorithm CLI AI receipt replay
        # Replays saved independent edits; CI never invokes the generator.
        run: node --test tests/k321-k322-compiler-algorithm-cli-receipt.test.mjs && npm run verify:k321-k322-compiler-algorithm-cli
      - name: Evidence-empty baseline report
        run: node scripts/universal-program-stress-report.mjs examples/universal-stress/v0.1-baseline-evidence.json output/universal-stress-v0.1
      - name: Consolidated K400 campaign report
        run: npm run evidence:k400
      - name: Upload evidence report
        uses: actions/upload-artifact@v4
        with:
          name: rcl-universal-stress-v0.1-report
          path: |
            output/universal-stress-v0.1
            output/universal-stress-k400
            output/k08-pure-rcl-xor-v0.1
            output/k08-general-mlp-v0.1
            output/k08-native-autodiff-v0.1
          if-no-files-found: error

  k01-windows-verification:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build or verify Windows native artifacts
        run: npm run build:native
      - name: K01 Windows self-hosting compiler campaign
        run: node scripts/run-universal-stress-k01.mjs output/universal-stress-v0.1/K01 examples/universal-stress/k01-ai-generation-contract.json
      - name: K329/K332 Windows native Compiler Simulation Scientific runtime replay
        run: npm run test:k329-k332-compiler-simulation-scientific && npm run verify:k329-k332-compiler-simulation-scientific-receipt
      - name: K326 Windows native Compiler Database runtime replay
        run: npm run test:k326-compiler-database && npm run verify:k326-compiler-database-receipt
      - name: K336 Windows native Compiler Automation runtime replay
        run: npm run test:k336-compiler-automation && npm run verify:k336-compiler-automation-receipt
      - name: K334 Windows native Compiler Agent runtime replay
        run: npm run test:k334-compiler-agent && npm run verify:k334-compiler-agent-receipt
      - name: K331 Windows native Compiler Realtime runtime replay
        run: npm run test:k331-compiler-realtime && npm run verify:k331-compiler-realtime-receipt
      - name: K333 Windows native Compiler ML runtime replay
        run: npm run test:k333-compiler-machine-learning && npm run verify:k333-compiler-machine-learning-receipt
      - name: K340 Windows native Compiler Mixed runtime replay
        run: node --test tests/k340-compiler-mixed-paradigm.test.mjs && npm run verify:k340-compiler-mixed-paradigm
      - name: K337/K338 Windows native Compiler Governance runtime replay
        run: node --test tests/k337-k338-compiler-governance-reactive.test.mjs && npm run verify:k337-k338-compiler-governance-reactive
      - name: K321/K322 Windows native Algorithm CLI runtime replay
        run: node --test tests/k321-k322-compiler-algorithm-cli-receipt.test.mjs && npm run verify:k321-k322-compiler-algorithm-cli
      - name: K08 Tensor native provider and CPU engine tests
        run: npm run test:k08-tensor
      - name: AI009 RCL self-hosted General MLP Tensor lowering admission
        run: npm run test:selfhost-general-mlp-tensor-lowering
      - name: K08 Tensor Windows performance evidence
        run: npm run evidence:k08-tensor-cpu
      - name: K08 General MLP Tensor lowering evidence
        run: npm run evidence:k08-tensor-mlp
      - name: K08 Native Autodiff and General MLP migration evidence
        run: npm run evidence:k08-autodiff
      - name: K08 Tensor borrowed-input and process-memory evidence
        shell: pwsh
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'rcl-k08-f-baseline'
          git worktree add --detach $baseline 9805956dfd24834d650534a8186ab53eb084f8b5
          cargo build --release --locked --manifest-path (Join-Path $baseline 'native/tensor-engine/Cargo.toml')
          $baselineBinary = Join-Path $baseline 'native/tensor-engine/target/release/rcl-tensor-engine.exe'
          npm run evidence:k08-tensor-borrowed-input -- --baseline-binary $baselineBinary --baseline-repository $baseline --baseline-commit 9805956dfd24834d650534a8186ab53eb084f8b5 --rounds 5 --rss-rounds 5
      - name: Upload K01 evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcl-universal-stress-k01-windows
          path: |
            output/universal-stress-v0.1/K01
            output/selfhost
            output/k08-tensor-cpu-v0.1
            output/k08-general-mlp-tensor-v0.1
            output/k08-tensor-borrowed-input-v0.1
            output/k08-native-autodiff-v0.1
          if-no-files-found: warn
