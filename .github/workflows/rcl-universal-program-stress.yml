name: RCL Universal Program Stress v0.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'src/universal-program-stress.mjs'
      - 'src/universal-stress-*.mjs'
      - 'src/ui/**'
      - 'tests/universal*stress*.test.mjs'
      - 'tests/general-selfhost-fixedpoint.test.mjs'
      - 'tests/selfhost*.test.mjs'
      - 'tests/stage*.test.mjs'
      - 'scripts/universal-program-stress-report.mjs'
      - 'scripts/build-k400-evidence.mjs'
      - 'scripts/run-universal-stress-k01.mjs'
      - 'scripts/run-k08-pure-rcl-xor.mjs'
      - 'scripts/run-k08-general-mlp.mjs'
      - 'scripts/run-k233-independent-ai-generation.mjs'
      - 'scripts/verify-k233-ai-generation-receipt.mjs'
      - 'scripts/verify-rcl-selfhost-*.mjs'
      - 'scripts/verify-native-windows-boundary.mjs'
      - 'selfhost/**'
      - 'native/**'
      - 'examples/native-ui/**'
      - 'examples/native-ai/**'
      - 'examples/universal-stress/**'
      - 'docs/K400_COMPLETION_CAMPAIGN_v0.1.md'
      - 'docs/K08_RCL_NATIVE_AI_CAMPAIGN_v0.1.md'
      - 'docs/RCL_UNIVERSAL_PROGRAM_STRESS_TEST_v0.1.md'
      - '.github/workflows/rcl-universal-program-stress.yml'
  pull_request:
    paths:
      - 'src/universal-program-stress.mjs'
      - 'src/universal-stress-*.mjs'
      - 'src/ui/**'
      - 'tests/universal*stress*.test.mjs'
      - 'tests/general-selfhost-fixedpoint.test.mjs'
      - 'tests/selfhost*.test.mjs'
      - 'tests/stage*.test.mjs'
      - 'scripts/universal-program-stress-report.mjs'
      - 'scripts/build-k400-evidence.mjs'
      - 'scripts/run-universal-stress-k01.mjs'
      - 'scripts/run-k08-pure-rcl-xor.mjs'
      - 'scripts/run-k08-general-mlp.mjs'
      - 'scripts/run-k233-independent-ai-generation.mjs'
      - 'scripts/verify-k233-ai-generation-receipt.mjs'
      - 'scripts/verify-rcl-selfhost-*.mjs'
      - 'scripts/verify-native-windows-boundary.mjs'
      - 'selfhost/**'
      - 'native/**'
      - 'examples/native-ui/**'
      - 'examples/native-ai/**'
      - 'examples/universal-stress/**'
      - 'docs/K400_COMPLETION_CAMPAIGN_v0.1.md'
      - 'docs/K08_RCL_NATIVE_AI_CAMPAIGN_v0.1.md'
      - 'docs/RCL_UNIVERSAL_PROGRAM_STRESS_TEST_v0.1.md'
      - '.github/workflows/rcl-universal-program-stress.yml'

permissions:
  contents: read

jobs:
  focused-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build native compiler and VM
        run: npm run build:native
      - name: Universal stress unit tests
        run: node --test tests/universal*stress*.test.mjs
      - name: K08 Pure RCL XOR native learning campaign
        run: npm run evidence:k08-native-ai
      - name: K08 General MLP native learning campaign
        run: npm run evidence:k08-native-ai:general-mlp
      - name: K233 independent AI generation receipt replay
        run: npm run verify:k233-ai-generate
      - name: Evidence-empty baseline report
        run: node scripts/universal-program-stress-report.mjs examples/universal-stress/v0.1-baseline-evidence.json output/universal-stress-v0.1
      - name: Consolidated K400 campaign report
        run: npm run evidence:k400
      - name: Upload evidence report
        uses: actions/upload-artifact@v4
        with:
          name: rcl-universal-stress-v0.1-report
          path: |
            output/universal-stress-v0.1
            output/universal-stress-k400
            output/k08-pure-rcl-xor-v0.1
            output/k08-general-mlp-v0.1
          if-no-files-found: error

  k01-windows-verification:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build or verify Windows native artifacts
        run: npm run build:native
      - name: K01 Windows self-hosting compiler campaign
        run: node scripts/run-universal-stress-k01.mjs output/universal-stress-v0.1/K01 examples/universal-stress/k01-ai-generation-contract.json
      - name: Upload K01 evidence and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rcl-universal-stress-k01-windows
          path: |
            output/universal-stress-v0.1/K01
            output/selfhost
          if-no-files-found: warn
