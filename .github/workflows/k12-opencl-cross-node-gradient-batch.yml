name: K12 AMD OpenCL Cross-Node Gradient Batch

on:
  push:
    paths:
      - 'native/tensor-engine/src/autodiff.rs'
      - 'native/tensor-engine/src/bin/rcl-bf16-autodiff-adamw.rs'
      - 'native/tensor-engine/amd_opencl_bf16_provider.py'
      - 'tests/k08-gpu-gqa-rope-native-backward-adamw.test.mjs'
      - 'tests/k12-opencl-cross-node-gradient-batch.test.mjs'
      - 'examples/native-ai/gpu-opencl-cross-node-gradient-batch-*'
      - 'package.json'
      - '.github/workflows/k12-opencl-cross-node-gradient-batch.yml'
  pull_request:
    paths:
      - 'native/tensor-engine/src/autodiff.rs'
      - 'native/tensor-engine/src/bin/rcl-bf16-autodiff-adamw.rs'
      - 'native/tensor-engine/amd_opencl_bf16_provider.py'
      - 'tests/k08-gpu-gqa-rope-native-backward-adamw.test.mjs'
      - 'tests/k12-opencl-cross-node-gradient-batch.test.mjs'
      - 'examples/native-ai/gpu-opencl-cross-node-gradient-batch-*'
      - 'package.json'
      - '.github/workflows/k12-opencl-cross-node-gradient-batch.yml'

permissions:
  contents: read

jobs:
  cross-node-gradient-batch:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install lockfile dependencies
        run: npm ci
      - name: Build tensor engine
        run: cargo build --release --locked --manifest-path native/tensor-engine/Cargo.toml --bin rcl-bf16-autodiff-adamw --bin rcl-rope-frame
      - name: Run K12 cross-node gradient batch verification
        run: npm run test:k12-opencl-cross-node-gradient-batch
      - name: Run K11 gradient pair regression
        run: npm run test:k11-opencl-gradient-pair-batch
