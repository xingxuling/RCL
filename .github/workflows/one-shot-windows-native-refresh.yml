name: one-shot-windows-native-refresh

on:
  push:
    branches: [codex/canonical-number-roundtrip-v095]

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  rebuild-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/canonical-number-roundtrip-v095
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
          use-cache: false
      - name: Rebuild Windows native distribution and refresh manifest
        run: node scripts/build-native-windows.mjs
      - name: Verify rebuilt distribution against source manifest
        run: node scripts/build-native.mjs
      - name: Verify Number ABI and self-host byte parity on Windows
        run: node --test tests/native-number-text-parity.test.mjs
      - name: Run bounded K08 native MLP regression on Windows
        run: node scripts/run-k08-general-mlp.mjs
      - name: Commit verified Windows native distribution
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add native/rclvm.exe native/rclc.exe native/rclvmd.exe native/provider_demo.exe native/rclfoundation.exe native/librclvm.a native/rclvm.dll native/rclvm.lib native/native-windows-manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "build(native): refresh Windows distribution for canonical Number ABI [skip ci]"
          git push origin HEAD:codex/canonical-number-roundtrip-v095
