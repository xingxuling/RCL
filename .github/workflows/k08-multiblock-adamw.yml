name: K08 Multi-Block AdamW v0.1

on:
  push:
    branches:
      - codex/rcl-1b-multiblock-adamw-v01
    paths:
      - 'examples/native-ai/multiblock-adamw-*'
      - 'examples/native-ai/multiblock-lm-*'
      - 'native/tensor-engine/**'
      - 'scripts/run-k08-native-autodiff.mjs'
      - 'tests/k08-multiblock-adamw.test.mjs'
      - '.github/workflows/k08-multiblock-adamw.yml'
  pull_request:
    paths:
      - 'examples/native-ai/multiblock-adamw-*'
      - 'examples/native-ai/multiblock-lm-*'
      - 'native/tensor-engine/**'
      - 'scripts/run-k08-native-autodiff.mjs'
      - 'tests/k08-multiblock-adamw.test.mjs'
      - '.github/workflows/k08-multiblock-adamw.yml'

jobs:
  multiblock-adamw:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build native compiler and VM
        run: npm run build:native
      - name: Run K08-R multi-block AdamW evidence tests
        run: npm run test:k08-multiblock-adamw
