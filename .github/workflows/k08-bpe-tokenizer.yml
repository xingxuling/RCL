name: K08 BPE Tokenizer v0.1

on:
  push:
    branches:
      - codex/rcl-1b-bpe-genome-v01
    paths:
      - 'native/tokenizer-engine/**'
      - 'examples/native-ai/bpe-tokenizer*'
      - 'tests/k08-bpe-tokenizer.test.mjs'
      - '.github/workflows/k08-bpe-tokenizer.yml'
  pull_request:
    paths:
      - 'native/tokenizer-engine/**'
      - 'examples/native-ai/bpe-tokenizer*'
      - 'tests/k08-bpe-tokenizer.test.mjs'
      - '.github/workflows/k08-bpe-tokenizer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bpe-tokenizer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build native compiler and VM
        run: npm run build:native
      - name: Run K08-M BPE tokenizer evidence tests
        run: node --test --test-concurrency=1 tests/k08-bpe-tokenizer.test.mjs
