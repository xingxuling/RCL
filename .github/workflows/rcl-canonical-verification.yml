name: RCL Canonical Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install from lockfile
        run: npm ci --ignore-scripts
      - name: Verify canonical-source contract
        run: npm run verify:version-contract
      - name: Build native host
        run: npm run build:native
      - name: Verify Stage40 boundary
        run: npm run verify:selfhost-stage40
      - name: Verify native platform boundary
        run: npm run verify:native-boundary
      - name: Verify source capability metabolism gate
        run: node --test tests/000-source-capability-metabolism-integration.test.mjs
      - name: Verify source capability SQL gate
        run: node --test tests/001-source-capability-sql-diagnostic.test.mjs
      - name: Verify equivalence corpus forge gate
        run: node --test tests/002-equivalence-corpus-forge.test.mjs
      - name: Verify executable negative controls and adaptive corpus gate
        run: node --test tests/003-executable-negative-controls-adaptive-loop.test.mjs
      - name: Run RCL test suite
        run: npm test
      - name: Verify self-hosted examples
        run: npm run verify:selfhost-examples
