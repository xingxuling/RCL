name: Materialize RCL Authority Metadata

on:
  push:
    branches: [fix/authority-metadata-downstream-contract-v0.1]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: fix/authority-metadata-downstream-contract-v0.1
          fetch-depth: 0
      - name: Normalize package authority metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.description = 'RCL (Reality Compiler Language): an evidence-bearing, permission-constrained reality transaction language, compiler, native VM, provider runtime, and verification toolchain.';
          pkg.repository = {
            type: 'git',
            url: 'git+https://github.com/xingxuling/RCL.git'
          };
          pkg.homepage = 'https://github.com/xingxuling/RCL#readme';
          pkg.bugs = { url: 'https://github.com/xingxuling/RCL/issues' };
          pkg.engines = { ...(pkg.engines ?? {}), node: '>=20' };
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts
      - name: Verify authority contracts
        run: node scripts/verify-version-contract.mjs
      - name: Remove one-shot materializer and commit
        run: |
          rm .github/workflows/materialize-rcl-authority-metadata.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/materialize-rcl-authority-metadata.yml
          git commit -m 'fix(authority): normalize package metadata and remove materializer'
          git push origin HEAD:fix/authority-metadata-downstream-contract-v0.1
