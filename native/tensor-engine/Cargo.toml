[package]
name = "rcl-tensor-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Optimized CPU execution organ for canonical RCL Tensor semantics"

[dependencies]
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
